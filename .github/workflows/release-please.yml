name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Attach the GraphQL contract to the GitHub Release: schema.graphql (the tracked SDL,
  # also what `schema:diff` compares against) and schema.json (introspection, built here
  # on the fly — it is not tracked). The CHANGELOG stays the single one, written by
  # release-please.
  publish-schema:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The published SDL must be the one of the tagged source, not a stale commit.
      - name: Check schema.graphql is up to date
        run: npm run schema:check

      # Builds docs-site/static/schema.json (introspection) from schema.graphql.
      - name: Generate schema introspection
        run: npm run docs:schema

      - name: Upload contract assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" schema.graphql docs-site/static/schema.json --clobber
