# ============================================
# 15. INSTRUCTIONS POUR APOLLO STUDIO
# ============================================

# Pour tester avec Apollo Studio:
#
# 1. HEADER HTTP:
#    Dans l'onglet "Headers" d'Apollo Studio, ajouter:
#    {
#      "X-Catalog-ID": "macroeconomics"
#    }
#
# 2. PARAMÈTRE GRAPHQL:
#    Utiliser le paramètre database dans vos requêtes:
#    getMetaData(name: "country", catalog: "public_finance")
#
# 3. PRIORITÉ:
#    GraphQL parameter > HTTP header > default database
#
# 4. CATALOGUES DUCKLAKE DISPONIBLES:
#    - default          (météorologie: indicator, country, kind, model, training, horizon)
#    - macroeconomics   (macro-économie: indicator, country, frequency, source, scenario, year)
#    - public_finance   (finances publiques: indicator, country, sector, category, classification, year)
#
# 5. CHAMPS CATÉGORIELS PAR CATALOGUE (utilisables dans getDimensionTable / groupBy):
#    default:         indicator, country, kind, model, training, horizon
#    macroeconomics:  indicator, country, frequency, source, scenario, year
#    public_finance:  indicator, country, sector, category, classification, year
#
# 6. VALIDATION:
#    Les catalogues non configurés lèvent une erreur (contrairement au comportement
#    précédent qui revenait silencieusement au default).
#
# 7. EXEMPLES DE HEADERS:
#    Valide:   { "X-Catalog-ID": "macroeconomics" }
#    Invalide: { "X-Catalog-ID": "unknown" }  -> erreur levée
#    Vide:     { "X-Catalog-ID": "" }         -> utilise default

# ============================================
# 16. TESTS CATALOGUE (getCatalogs, getCatalogSchema, getSharedDimensions)
# ============================================

# Test 16.1: Lister tous les catalogues disponibles avec leurs schémas
# Utile pour alimenter dynamiquement un sélecteur de catalogue/schéma dans l'UI
query TestGetCatalogs {
  getCatalogs {
    id
    defaultSchema
    schemas {
      name
    }
  }
}

# Test 16.1b: Version minimaliste (identifiants seulement)
query TestGetCatalogsLight {
  getCatalogs {
    id
  }
}

# Test 16.1c: Listage + contenu du schéma par défaut en une seule requête
# (enchaînement typique côté UI sans utiliser la cascade)
query TestGetCatalogsThenSchema {
  catalogs: getCatalogs {
    id
    defaultSchema
    schemas {
      name
    }
  }
  macroDefaultSchema: getCatalogSchema(catalog: "macroeconomics") {
    name
    label
    is_categorical
  }
}

# Test 16.1d: Cascade — catalogues → schémas → champs en UNE seule requête
# Les sous-champs fields/dimensionNames sont chargés à la demande via la
# selection set GraphQL ; un client qui veut juste les noms ne paie rien.
query TestGetCatalogsCascade {
  getCatalogs {
    id
    defaultSchema
    schemas {
      name
      dimensionNames
      fields {
        name
        label
        sql_type
        is_categorical
      }
    }
  }
}

