# Requêtes de test pour l'API GraphQL DuckDB avec support multi-database
# À utiliser dans Apollo Studio (https://studio.apollographql.com)
#
# CONFIGURATION MULTI-DATABASE:
# - HTTP Header: X-Database-ID: [database_name]
# - GraphQL Parameter: database: "[database_name]"
# - Databases disponibles: default, macroeconomics, public_finance
#
# Priorité: GraphQL parameter > HTTP header > default database

# ============================================
# 1. TESTS DES MÉTADONNÉES
# ============================================

# Test 1.1: Récupérer les métadonnées d'un champ (database par défaut)
query TestGetMetadata {
  getMetaData(name: "country") {
    name
    label
    python_type
    sql_type
    is_categorical
  }
}

# Test 1.1b: Récupérer les métadonnées avec database spécifique
query TestGetMetadataSpecificDB {
  getMetaData(name: "country", database: "macroeconomics") {
    name
    label
    python_type
    sql_type
    is_categorical
  }
}

# Test 1.2: Récupérer les métadonnées de plusieurs champs
query TestMultipleMetadata {
  indicator: getMetaData(name: "indicator") {
    name
    label
    is_categorical
  }
  value: getMetaData(name: "value") {
    name
    label
    is_categorical
  }
  date: getMetaData(name: "date") {
    name
    sql_type
    is_categorical
  }
}

# Test 1.2b: Récupérer les métadonnées de plusieurs champs avec databases différentes
query TestMultipleMetadataCrossDB {
  defaultIndicator: getMetaData(name: "indicator", database: "default") {
    name
    label
    is_categorical
  }
  macroeconomicsValue: getMetaData(name: "value", database: "macroeconomics") {
    name
    label
    is_categorical
  }
  public_financeDate: getMetaData(name: "date", database: "public_finance") {
    name
    sql_type
    is_categorical
  }
}

# ============================================
# 2. TESTS DES TABLES DE DIMENSION
# ============================================

# Test 2.1: Récupérer une table de dimension
query TestGetDimension {
  getDimensionTable(name: "country") {
    value
    label
  }
}

# Test 2.1b: Récupérer une table de dimension depuis macroeconomics database
query TestGetDimensionmacroeconomics {
  getDimensionTable(name: "country", database: "macroeconomics") {
    value
    label
  }
}

# Test 2.2: Récupérer plusieurs dimensions
query TestMultipleDimensions {
  countries: getDimensionTable(name: "country") {
    value
    label
  }
  indicators: getDimensionTable(name: "indicator") {
    value
    label
  }
  kinds: getDimensionTable(name: "kind") {
    value
    label
  }
}

# Test 2.2b: Récupérer dimensions depuis databases différentes
query TestMultipleDimensionsCrossDB {
  defaultCountries: getDimensionTable(name: "country", database: "default") {
    value
    label
  }
  macroeconomicsIndicators: getDimensionTable(name: "indicator", database: "macroeconomics") {
    value
    label
  }
  public_financeKinds: getDimensionTable(name: "kind", database: "public_finance") {
    value
    label
  }
}

# ============================================
# 3. TESTS DE LA TABLE DES FAITS
# ============================================

# Test 3.1: Requête simple avec pagination
query TestFactTableSimple {
  getFactTable(limit: 10, offset: 0) {
    data {
      value
    }
    total
    hasNextPage
    currentPage
    totalPages
  }
}

# Test 3.1b: Requête simple depuis macroeconomics database
query TestFactTablemacroeconomics {
  getFactTable(limit: 10, offset: 0, database: "macroeconomics") {
    data {
      value
    }
    total
    hasNextPage
    currentPage
    totalPages
  }
}

# Test 3.2: Requête avec filtres
query TestFactTableWithFilters {
  getFactTable(
    filters: "country = 1 AND indicator = 1"
    limit: 20
    offset: 0
  ) {
    data {
      value
    }
    total
  }
}

# Test 3.3: Requête avec filtres structurés
query TestFactTableStructuredFilters {
  getFactTable(
    structuredFilters: [
      { key: "country", operator: "=", value: "1" }
      { key: "kind", operator: "=", value: "1" }
    ]
    limit: 10
    offset: 0
  ) {
    data {
      value
    }
    total
  }
}

# Test 3.4: Requête avec tri
query TestFactTableWithSort {
  getFactTable(
    sort: [
      { field: "value", order: DESC }
      { field: "date", order: ASC }
    ]
    limit: 15
    offset: 0
  ) {
    data {
      value
    }
    total
  }
}

# Test 3.5: Requête avec sélection de champs spécifiques
query TestFactTableSelectFields {
  getFactTable(
    fields: ["country", "indicator", "value", "date"]
    limit: 5
    offset: 0
  ) {
    data {
      value
    }
    total
  }
}

# Test 3.6: Requête avec détails des dimensions
query TestFactTableWithDimensionDetails {
  getFactTable(limit: 5, offset: 0) {
    data {
      value
      dimensionDetails {
        name
        value
        label
      }
    }
    total
  }
}

# ============================================
# 4. TESTS DE LA TABLE DES FAITS AVEC MÉTADONNÉES
# ============================================

# Test 4.1: Requête avec métadonnées optimisées pour D3
query TestFactTableWithMetadata {
  getFactTableWithMetadata(limit: 50, offset: 0) {
    columns
    data
    metadata {
      count
      extents
      total
      hasNextPage
      currentPage
      totalPages
    }
  }
}

# Test 4.2: Requête avec métadonnées et filtres
query TestFactTableMetadataFiltered {
  getFactTableWithMetadata(
    structuredFilters: [
      { key: "country", operator: "IN", values: ["1", "2", "3"] }
    ]
    limit: 100
    offset: 0
  ) {
    columns
    data
    metadata {
      count
      extents
      total
    }
  }
}

# ============================================
# 5. TESTS DES FAITS AGRÉGÉS
# ============================================

# Test 5.1: Agrégation simple
query TestAggregatedFactsSimple {
  getAggregatedFacts(
    groupBy: "country"
    aggregation: SUM
    limit: 10
    offset: 0
  ) {
    key
    aggregatedValue
    count
  }
}

# Test 5.2: Différentes fonctions d'agrégation
query TestAggregationFunctions {
  sumByCountry: getAggregatedFacts(groupBy: "country", aggregation: SUM) {
    key
    aggregatedValue
  }
  avgByIndicator: getAggregatedFacts(groupBy: "indicator", aggregation: AVG) {
    key
    aggregatedValue
  }
  maxByKind: getAggregatedFacts(groupBy: "kind", aggregation: MAX) {
    key
    aggregatedValue
  }
  countByModel: getAggregatedFacts(groupBy: "model", aggregation: COUNT) {
    key
    aggregatedValue
  }
}

# Test 5.3: Agrégation avec filtres
query TestAggregatedFactsFiltered {
  getAggregatedFacts(
    groupBy: "indicator"
    aggregation: AVG
    filters: "country IN (1, 2) AND kind = 1"
    limit: 20
    offset: 0
  ) {
    key
    aggregatedValue
    count
  }
}

# Test 5.4: Agrégation avec tri
query TestAggregatedFactsSorted {
  getAggregatedFacts(
    groupBy: "country"
    aggregation: SUM
    sort: [{ field: "aggregatedValue", order: DESC }]
    limit: 10
    offset: 0
  ) {
    key
    aggregatedValue
    count
  }
}

# Test 5.5: Agrégation avec labels de clés
query TestAggregatedFactsWithKeyLabels {
  getAggregatedFacts(
    groupBy: "country"
    aggregation: SUM
    limit: 5
    offset: 0
  ) {
    key
    keyLabel
    aggregatedValue
    count
  }
}

# ============================================
# 6. TESTS DES FAITS AGRÉGÉS AVEC MÉTADONNÉES
# ============================================

# Test 6.1: Agrégation avec métadonnées complètes
query TestAggregatedFactsWithMetadata {
  getAggregatedFactsWithMetadata(
    groupBy: "indicator"
    aggregation: AVG
    limit: 10
    offset: 0
  ) {
    data {
      key
      keyLabel
      aggregatedValue
      count
    }
    metadata {
      count
      keyExtent
      valueExtent
      statistics {
        mean
        median
        stdDev
        quartiles
      }
      groupByFieldInfo {
        name
        label
        is_categorical
      }
    }
  }
}

