# Test 17.2: Comparaison de faits ligne à ligne entre deux catalogues
# Joint les tables de faits sur le champ country
# → Pour chaque ligne de default, trouve la ligne correspondante dans macroeconomics
query TestCompareFacts {
  compareFacts(
    catalogA: "default"
    catalogB: "macroeconomics"
    joinFields: ["country"]
    limit: 10
    offset: 0
  ) {
    data {
      key
      valueA
      valueB
      delta
      deltaPercent
    }
    total
    hasNextPage
    currentPage
    totalPages
  }
}

# Test 17.2b: Comparaison avec tri par delta décroissant
query TestCompareFactsSorted {
  compareFacts(
    catalogA: "default"
    catalogB: "macroeconomics"
