}

# ============================================
# 3. TESTS DE LA TABLE DES FAITS
# ============================================

# Test 3.1: Requête simple avec pagination (catalogue default)
query TestFactTableSimple {
  getFactTable(limit: 10, offset: 0) {
    data {
      value
    }
    total
    hasNextPage
    currentPage
    totalPages
  }
}

# Test 3.1b: Requête simple depuis le catalogue macroeconomics
query TestFactTableMacroeconomics {
  getFactTable(limit: 10, offset: 0, database: "macroeconomics") {
    data {
      value
    }
    total
    hasNextPage
    currentPage
    totalPages
  }
}

# Test 3.1c: Requête simple depuis le catalogue public_finance
query TestFactTablePublicFinance {
  getFactTable(limit: 10, offset: 0, database: "public_finance") {
    data {
      value
    }
    total
    hasNextPage
    currentPage
    totalPages
  }
}

# Test 3.2: Requête avec filtres (IDs entiers des dimensions)
query TestFactTableWithFilters {
  getFactTable(
    filters: "country = 1 AND indicator = 1"
    limit: 20
    offset: 0
  ) {
    data {
      value
    }
    total
  }
}

# Test 3.3: Requête avec filtres structurés (catalogue default)
# Utilise les champs catégoriels propres au catalogue default
query TestFactTableStructuredFilters {
  getFactTable(
    structuredFilters: [
      { key: "country", operator: "=", value: "1" }
      { key: "kind", operator: "=", value: "1" }
    ]
    limit: 10
    offset: 0
  ) {
    data {
      value
    }
    total
  }
}

# Test 3.3b: Filtres structurés sur le catalogue macroeconomics
query TestFactTableStructuredFiltersMacro {
  getFactTable(
    structuredFilters: [
      { key: "country", operator: "=", value: "1" }
      { key: "scenario", operator: "=", value: "1" }
    ]
    limit: 10
    offset: 0
    database: "macroeconomics"
  ) {
    data {
      value
    }
    total
  }
}

# Test 3.4: Requête avec tri
query TestFactTableWithSort {
  getFactTable(
    sort: [
      { field: "value", order: DESC }
      { field: "date", order: ASC }
    ]
    limit: 15
    offset: 0
  ) {
    data {
      value
    }
    total
  }
}

# Test 3.5: Requête avec sélection de champs spécifiques
query TestFactTableSelectFields {
  getFactTable(
    fields: ["country", "indicator", "value", "date"]
    limit: 5
    offset: 0
  ) {
    data {
      value
    }
    total
  }
}

# Test 3.6: Requête avec détails des dimensions (enrichissement automatique)
query TestFactTableWithDimensionDetails {
  getFactTable(limit: 5, offset: 0) {
    data {
      value
      dimensionDetails {
        name
        value
        label
      }
    }
    total
  }
}

