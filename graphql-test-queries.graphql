# 17. TESTS CROSS-DATABASE (requiert ALLOW_CROSS_DATABASE_QUERIES=true)
# ============================================
#
# PRÉREQUIS: Définir la variable d'environnement avant de lancer le serveur:
#   ALLOW_CROSS_DATABASE_QUERIES=true npm run dev
# ou $env:ALLOW_CROSS_DATABASE_QUERIES="true"; npm run dev sur Powershell
#
# Ces requêtes exploitent le fait que tous les catalogues sont attachés
# à la même instance DuckDB en mémoire – les JOINs sont natifs.

# Test 17.1: Options de sélection communes à deux catalogues
# Retourne les valeurs de country présentes dans default ET macroeconomics
query TestCrossDatabaseSelectOptions {
  crossDatabaseSelectOptions(
    fieldName: "country"
    databases: ["default", "macroeconomics"]
    limit: 50
  ) {
    value
    label
  }
}

# Test 17.1b: Options communes à trois catalogues
query TestCrossDatabaseSelectOptionsAll {
  crossDatabaseSelectOptions(
    fieldName: "country"
    databases: ["default", "macroeconomics", "public_finance"]
    limit: 50
  ) {
    value
    label
  }
}

# Test 17.1c: Options communes pour indicator
query TestCrossDatabaseSelectOptionsIndicator {
  crossDatabaseSelectOptions(
    fieldName: "indicator"
    databases: ["default", "macroeconomics"]
    limit: 50
  ) {
    value
    label
  }
}

# Test 17.2: Comparaison de faits ligne à ligne entre deux catalogues
# Joint les tables de faits sur le champ country
# → Pour chaque ligne de default, trouve la ligne correspondante dans macroeconomics
query TestCompareFacts {
  compareFacts(
    databaseA: "default"
    databaseB: "macroeconomics"
    joinFields: ["country"]
    limit: 10
    offset: 0
  ) {
    key
    valueA
    valueB
    delta
    deltaPercent
  }
}

# Test 17.2b: Comparaison avec tri par delta décroissant
query TestCompareFactsSorted {
  compareFacts(
    databaseA: "default"
    databaseB: "macroeconomics"
    joinFields: ["country"]
    limit: 20
    offset: 0
    sort: [{ field: "delta", order: DESC }]
  ) {
    key
    valueA
    valueB
    delta
    deltaPercent
  }
}

# Test 17.2c: Comparaison avec jointure sur plusieurs champs
# Joint sur (country, indicator) – clé composite séparée par '::'
query TestCompareFactsMultiJoin {
  compareFacts(
    databaseA: "default"
    databaseB: "macroeconomics"
    joinFields: ["country", "indicator"]
    limit: 10
    offset: 0
  ) {
    key
    valueA
    valueB
    delta
    deltaPercent
  }
}

# Test 17.3: Comparaison de faits agrégés entre deux catalogues
# Agrège (SUM) les valeurs par country dans chaque catalogue puis compare
query TestCompareAggregatedFacts {
  compareAggregatedFacts(
    databaseA: "default"
    databaseB: "macroeconomics"
    groupBy: "country"
    aggregation: SUM
    limit: 10
    offset: 0
  ) {
    key
    valueA
    valueB
    delta
    deltaPercent
  }
}

# Test 17.3b: Comparaison par indicator avec agrégation AVG
query TestCompareAggregatedFactsByIndicator {
