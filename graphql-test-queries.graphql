# Test 2.2b: Dimensions depuis des catalogues différents
# Attention: chaque catalogue a ses propres dimensions catégorielles
query TestMultipleDimensionsCrossDB {
  # default: indicator, country, kind, model, training, horizon
  defaultCountries: getDimensionTable(name: "country", database: "default") {
    value
    label
  }
  # macroeconomics: indicator, country, frequency, source, scenario, year
  macroeconomicsScenarios: getDimensionTable(name: "scenario", database: "macroeconomics") {
