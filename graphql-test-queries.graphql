# 10. TESTS DE COMPLEXITÉ
# ============================================

# Test 10.1: Requête complexe combinée (catalogue default)
query TestComplexQuery {
  # Métadonnées
  countryMeta: getMetaData(name: "country") {
    name
    label
    is_categorical
  }

  # Dimensions
  countries: getDimensionTable(name: "country") {
    value
    label
  }

  # Faits avec détails
  facts: getFactTable(
    structuredFilters: [
      { key: "country", operator: "=", value: "1" }
    ]
    sort: [{ field: "value", order: DESC }]
    limit: 5
    offset: 0
  ) {
    data {
      value
      dimensionDetails {
        name
        value
        label
      }
    }
    total
  }

  # Agrégations
  aggregated: getAggregatedFacts(
    groupBy: "indicator"
    aggregation: AVG
    filters: "country = 1"
  ) {
    key
    keyLabel
    aggregatedValue
  }

  # Options de sélection
  options: getSelectOptions(fieldName: "indicator") {
    value
    label
  }
}

