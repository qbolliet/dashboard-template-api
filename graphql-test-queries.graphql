query TestInvalidDatabase {
  getMetaData(name: "country", database: "nonexistent") {
    name
    label
  }
}

# Test 14.2: Database vide (devrait utiliser context/default)
query TestEmptyDatabase {
  getMetaData(name: "country", database: "") {
    name
    label
  }
}

# ============================================
# 15. INSTRUCTIONS POUR APOLLO STUDIO
# ============================================

# Pour tester avec Apollo Studio:
#
# 1. HEADER HTTP:
#    Dans l'onglet "Headers" d'Apollo Studio, ajouter:
#    {
#      "X-Database-ID": "macroeconomics"
#    }
#
# 2. PARAMÈTRE GRAPHQL:
#    Utiliser le paramètre database dans vos requêtes:
#    getMetaData(name: "country", database: "public_finance")
#
# 3. PRIORITÉ:
#    GraphQL parameter > HTTP header > default database
#
# 4. DATABASES DISPONIBLES:
#    - default (database principal)
#    - macroeconomics (données analytiques)
#    - public_finance (données de public_finance)
#
# 5. VALIDATION:
#    Les databases non configurées reviennent au default
#    Les erreurs de configuration sont loggées
#
# 6. EXEMPLES DE HEADERS:
#    Valide:   { "X-Database-ID": "macroeconomics" }
#    Invalide: { "X-Database-ID": "unknown" }  -> utilise default
#    Vide:     { "X-Database-ID": "" }         -> utilise default