# ============================================
# 15. INSTRUCTIONS POUR APOLLO STUDIO
# ============================================

# Pour tester avec Apollo Studio:
#
# 1. HEADER HTTP:
#    Dans l'onglet "Headers" d'Apollo Studio, ajouter:
#    {
#      "X-Database-ID": "macroeconomics"
#    }
#
# 2. PARAMÈTRE GRAPHQL:
#    Utiliser le paramètre database dans vos requêtes:
#    getMetaData(name: "country", database: "public_finance")
#
# 3. PRIORITÉ:
#    GraphQL parameter > HTTP header > default database
#
# 4. CATALOGUES DUCKLAKE DISPONIBLES:
#    - default          (météorologie: indicator, country, kind, model, training, horizon)
#    - macroeconomics   (macro-économie: indicator, country, frequency, source, scenario, year)
#    - public_finance   (finances publiques: indicator, country, sector, category, classification, year)
#
# 5. CHAMPS CATÉGORIELS PAR CATALOGUE (utilisables dans getDimensionTable / groupBy):
#    default:         indicator, country, kind, model, training, horizon
#    macroeconomics:  indicator, country, frequency, source, scenario, year
#    public_finance:  indicator, country, sector, category, classification, year
#
# 6. VALIDATION:
#    Les catalogues non configurés lèvent une erreur (contrairement au comportement
#    précédent qui revenait silencieusement au default).
#
# 7. EXEMPLES DE HEADERS:
#    Valide:   { "X-Database-ID": "macroeconomics" }
#    Invalide: { "X-Database-ID": "unknown" }  -> erreur levée
#    Vide:     { "X-Database-ID": "" }         -> utilise default

