  sumByCountry: getAggregatedFacts(groupBy: "country", aggregation: SUM) {
    key
    aggregatedValue
  }
  avgByIndicator: getAggregatedFacts(groupBy: "indicator", aggregation: AVG) {
    key
    aggregatedValue
  }
  maxByKind: getAggregatedFacts(groupBy: "kind", aggregation: MAX) {
    key
    aggregatedValue
  }
  countByModel: getAggregatedFacts(groupBy: "model", aggregation: COUNT) {
    key
    aggregatedValue
  }
}

# Test 5.2b: Agrégations sur les catalogues macroeconomics et public_finance
query TestAggregationFunctionsCrossDB {
  macroByScenario: getAggregatedFacts(
    groupBy: "scenario"
    aggregation: AVG
    catalog: "macroeconomics"
  ) {
    key
    aggregatedValue
  }
  financeBySector: getAggregatedFacts(
    groupBy: "sector"
    aggregation: SUM
    catalog: "public_finance"
  ) {
