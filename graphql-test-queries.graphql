# Requêtes de test pour l'API GraphQL – DuckLake (multi-catalog)
# À utiliser dans Apollo Studio (https://studio.apollographql.com)
#
# ARCHITECTURE DUCKLAKE (multi-catalogue, multi-schéma):
# - Chaque catalogue DuckLake (.ducklake) est attaché à un DuckDB partagé.
# - Un catalogue peut contenir un OU PLUSIEURS schémas (défaut: "main").
# - Les requêtes sont routées via "catalogue.schéma.table" (ex: default.main.fact_table).
#
# CONFIGURATION MULTI-CATALOGUE / MULTI-SCHÉMA:
# - HTTP Header: X-Catalog-ID: [catalog_name]   (+ X-Schema-ID: [schema_name], optionnel)
# - Paramètres GraphQL: catalog: "[catalog_name]", schema: "[schema_name]" (optionnel)
# - schema omis => schéma par défaut du catalogue (config SCHEMA, "main").
# - Catalogues disponibles: default, macroeconomics, public_finance
#
# Priorité: paramètre GraphQL > en-tête HTTP > catalogue/schéma par défaut
#
# SCHÉMA DES CATALOGUES:
#
# default (météorologie):
#   Catégoriels: indicator, country, kind, model, training, horizon
#   Continus:    week, date, value, lower_bound, upper_bound, quality_score, notes
#
# macroeconomics (macro-économie):
#   Catégoriels: indicator, country, frequency, source, scenario, year
#   Continus:    date, value, lower_bound, upper_bound, confidence_level, revision
#
# public_finance (finances publiques):
#   Catégoriels: indicator, country, sector, category, classification, year
#   Continus:    date, value, pct_gdp, lower_bound, upper_bound, notes

# ============================================
# 1. TESTS DES MÉTADONNÉES
# ============================================

# Test 1.1: Récupérer les métadonnées d'un champ (catalogue par défaut)
query TestGetMetadata {
  getMetaData(name: "country") {
    name
    label
    python_type
    sql_type
    is_categorical
  }
}

# Test 1.1b: Récupérer les métadonnées avec catalogue spécifique
query TestGetMetadataSpecificDB {
  getMetaData(name: "country", catalog: "macroeconomics") {
    name
    label
    python_type
    sql_type
    is_categorical
  }
}

# Test 1.2: Récupérer les métadonnées de plusieurs champs (catalogue default)
query TestMultipleMetadata {
  indicator: getMetaData(name: "indicator") {
    name
    label
    is_categorical
  }
  value: getMetaData(name: "value") {
    name
    label
    is_categorical
  }
  date: getMetaData(name: "date") {
    name
    sql_type
    is_categorical
  }
}

# Test 1.2b: Métadonnées depuis des catalogues différents
# Chaque catalogue expose ses propres champs catégoriels distinctifs
query TestMultipleMetadataCrossDB {
  defaultKind: getMetaData(name: "kind", catalog: "default") {
    name
    label
    is_categorical
  }
  macroeconomicsScenario: getMetaData(name: "scenario", catalog: "macroeconomics") {
    name
    label
    is_categorical
  }
  public_financeSector: getMetaData(name: "sector", catalog: "public_finance") {
    name
    sql_type
    is_categorical
  }
}

