}

# ============================================
# 5. TESTS DES FAITS AGRÉGÉS
# ============================================

# Test 5.1: Agrégation simple (catalogue default)
query TestAggregatedFactsSimple {
  getAggregatedFacts(
    groupBy: "country"
    aggregation: SUM
    limit: 10
    offset: 0
  ) {
    key
    aggregatedValue
    count
  }
}

# Test 5.2: Différentes fonctions d'agrégation (catalogue default)
query TestAggregationFunctions {
  sumByCountry: getAggregatedFacts(groupBy: "country", aggregation: SUM) {
    key
    aggregatedValue
  }
  avgByIndicator: getAggregatedFacts(groupBy: "indicator", aggregation: AVG) {
    key
    aggregatedValue
  }
  maxByKind: getAggregatedFacts(groupBy: "kind", aggregation: MAX) {
    key
    aggregatedValue
  }
  countByModel: getAggregatedFacts(groupBy: "model", aggregation: COUNT) {
    key
    aggregatedValue
  }
}

# Test 5.2b: Agrégations sur les catalogues macroeconomics et public_finance
query TestAggregationFunctionsCrossDB {
  macroByScenario: getAggregatedFacts(
    groupBy: "scenario"
    aggregation: AVG
    database: "macroeconomics"
  ) {
    key
    aggregatedValue
  }
  financeBySector: getAggregatedFacts(
    groupBy: "sector"
    aggregation: SUM
    database: "public_finance"
  ) {
    key
    aggregatedValue
  }
}

# Test 5.3: Agrégation avec filtres (catalogue default)
query TestAggregatedFactsFiltered {
  getAggregatedFacts(
    groupBy: "indicator"
    aggregation: AVG
    filters: "country IN (1, 2) AND kind = 1"
    limit: 20
    offset: 0
  ) {
    key
    aggregatedValue
    count
  }
}

# Test 5.4: Agrégation avec tri
query TestAggregatedFactsSorted {
  getAggregatedFacts(
    groupBy: "country"
    aggregation: SUM
    sort: [{ field: "aggregatedValue", order: DESC }]
    limit: 10
    offset: 0
  ) {
    key
    aggregatedValue
    count
  }
}

# Test 5.5: Agrégation avec labels de clés
query TestAggregatedFactsWithKeyLabels {
  getAggregatedFacts(
    groupBy: "country"
