# ============================================
# 20bis. MULTI-SCHÉMA (ciblage explicite d'un schéma au sein d'un catalogue)
# ============================================
#
# Un catalogue peut héberger plusieurs schémas DuckLake (ex: main, staging).
# L'argument `schema` permet de cibler explicitement un schéma autre que le
# schéma par défaut (premier élément de SCHEMAS dans la config).
# La validation passe par l'allow-list `databaseManager.isValidSchema()` :
# un schéma absent de la liste (config + découverte SQL) est rejeté.

# Test 20bis.1: Introspection — liste des schémas exposés par chaque catalogue
query TestIntrospectionSchemas {
  getCatalogs {
    id
    defaultSchema
    schemas {
      name
    }
  }
}

# Test 20bis.2: Métadonnées d'un schéma non-défaut
query TestGetCatalogSchemaWithSchema {
  getCatalogSchema(catalog: "default", schema: "main") {
    name
    label
    is_categorical
    sql_type
  }
}

# Test 20bis.3: Table des faits dans un schéma explicite
# /!\ Ne retourne rien
query TestFactTableWithSchema {
  getFactTable(catalog: "default", schema: "main", limit: 5, offset: 0) {
    indicator
    country
    value
  }
}

# Test 20bis.4: Dimensions partagées entre deux schémas spécifiés explicitement
query TestSharedDimensionsCrossSchema {
  getSharedDimensions(targets: [
    { catalog: "default", schema: "main" }
    { catalog: "macroeconomics", schema: "main" }
  ])
}

# Test 20bis.5: Schéma invalide — doit retourner une GraphQLError
# explicite ("Schema '…' is not available for catalog '…'")
query TestRejectsUnknownSchema {
  getCatalogSchema(catalog: "default", schema: "no_such_schema") {
    name
  }
}

# ============================================
# 21. RECHARGEMENT / INVALIDATION PAR CATALOGUE (endpoints REST admin)
# ============================================
#
# Ces opérations ne sont PAS du GraphQL : ce sont des endpoints REST admin
# protégés par l'en-tête x-admin-key (cf. docs deployment/data-refresh.md).
#
#   # Recharger UN seul catalogue (DETACH + ATTACH ciblé sur l'instance vivante)
#   curl -X POST -H "x-admin-key: $ADMIN_API_KEY" \
#     http://localhost:4000/api/catalog/reload/macroeconomics
#
#   # Puis invalider le cache de CE catalogue (tous ses schémas)
#   curl -X POST -H "x-admin-key: $ADMIN_API_KEY" \
#     http://localhost:4000/api/cache/invalidate/macroeconomics
