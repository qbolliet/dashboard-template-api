# PRÉREQUIS: Définir la variable d'environnement avant de lancer le serveur:
#   ALLOW_CROSS_CATALOG_QUERIES=true npm run dev
# ou $env:ALLOW_CROSS_CATALOG_QUERIES="true"; npm run dev sur Powershell
#
# Ces requêtes exploitent le fait que tous les catalogues sont attachés
# à la même instance DuckDB en mémoire – les JOINs sont natifs.

# Test 17.1: Options de sélection communes à deux catalogues
