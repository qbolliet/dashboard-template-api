# ============================================
# 18. TESTS FORMAT DONNÉES (OBJECTS vs ARRAYS)
# ============================================
#
# Le paramètre format: ARRAYS retourne les données comme un tableau de tableaux
# au lieu d'un tableau d'objets. Utile pour AG Grid, TanStack Table, etc.

# Test 18.1: Format OBJECTS (défaut) – compatible D3, Vega, Recharts
query TestFactTableFormatObjects {
  getFactTableWithMetadata(limit: 5, offset: 0) {
    columns
    data
    metadata {
      count
      total
    }
  }
}

# Test 18.2: Format ARRAYS – compatible AG Grid / TanStack Table
# data est un tableau de tableaux: [["val1", "val2", ...], ...]
# Les colonnes sont dans le même ordre que columns[]
query TestFactTableFormatArrays {
  getFactTableWithMetadata(limit: 5, offset: 0, format: ARRAYS) {
    columns
    data
    metadata {
      count
      total
    }
  }
}

# Test 18.3: Format ARRAYS avec filtres et tri
query TestFactTableFormatArraysFiltered {
  getFactTableWithMetadata(
    structuredFilters: [
      { key: "country", operator: "IN", values: ["0", "1", "2"] }
    ]
    sort: [{ field: "value", order: DESC }]
    limit: 10
    offset: 0
    format: ARRAYS
  ) {
    columns
    data
    metadata {
      count
      extents
      total
    }
  }
}

# Test 18.4: Format ARRAYS depuis un catalogue spécifique
query TestFactTableFormatArraysMacro {
  getFactTableWithMetadata(
    limit: 5
    offset: 0
    format: ARRAYS
    database: "macroeconomics"
  ) {
    columns
    data
    metadata {
      count
      total
    }
  }
}
