# 13. TESTS MULTI-DATABASE AVEC HTTP HEADERS
# ============================================

# Test 13.1: Utilisation du header HTTP X-Database-ID
# Dans Apollo Studio, ajouter dans Headers:
# {
#   "X-Database-ID": "macroeconomics"
# }
query TestWithHTTPHeader {
  getMetaData(name: "country") {
    name
    label
    is_categorical
  }
  getDimensionTable(name: "country") {
    value
    label
  }
}

# Test 13.2: Override du header avec paramètre GraphQL
# Header: X-Database-ID: macroeconomics
# Paramètre GraphQL: database: "public_finance"
# Le paramètre GraphQL a la priorité sur le header
query TestParameterOverridesHeader {
  fromHeader: getMetaData(name: "country") {
    name
    label
  }
  fromParameter: getMetaData(name: "country", database: "public_finance") {
    name
    label
  }
}

# Test 13.3: Requête complexe multi-catalogue DuckLake
query TestComplexMultiDB {
  # Métadonnées depuis default
  defaultMeta: getMetaData(name: "kind", database: "default") {
    name
    label
    is_categorical
  }

  # Dimensions depuis macroeconomics (champs propres à ce catalogue)
  macroeconomicsDims: getDimensionTable(name: "scenario", database: "macroeconomics") {
    value
    label
  }

  # Faits depuis public_finance
  public_financeFacts: getFactTable(
    limit: 5
    offset: 0
    database: "public_finance"
  ) {
    data {
      value
    }
    total
  }

  # Options depuis macroeconomics
  macroeconomicsOptions: getSelectOptions(
    fieldName: "source"
    limit: 5
    database: "macroeconomics"
  ) {
    value
    label
  }
}

