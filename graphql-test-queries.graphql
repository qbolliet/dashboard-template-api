# ============================================
# 19. TESTS GETFIELDS (NOMS DE VARIABLES POUR MENUS SELECT)
# ============================================
#
# getFields retourne les noms des champs de la table metadata au format
# {value, label} (identique à getSelectOptions) afin d'alimenter
# directement les menus <select> du frontend.
#
# Réutilise le loader catalogMetadata (cache Redis partagé avec
# getCatalogSchema) puis filtre en mémoire.
#
# Tous les filtres sont optionnels et combinables (AND):
#   - database       : alias du catalogue (par défaut: catalogue courant)
#   - sqlType        : type SQL exact, insensible à la casse (ex: "VARCHAR")
#   - isCategorical  : true = champs catégoriels, false = champs continus
#   - isPrimaryKey   : true/false pour inclure/exclure les clés primaires
#   - namePattern    : sous-chaîne case-insensitive dans le nom (style LIKE)

# Test 19.1: Tous les champs au format {value, label} (prêt pour <select>)
query TestGetFieldsAll {
  getFields {
    value
    label
  }
}

# Test 19.2: Champs catégoriels uniquement (menus de dimensions)
query TestGetFieldsCategorical {
  getFields(isCategorical: true) {
    value
    label
  }
}

# Test 19.3: Champs continus uniquement (axes numériques)
query TestGetFieldsContinuous {
  getFields(isCategorical: false) {
    value
    label
  }
}

# Test 19.4: Filtrage par type SQL (ex: tous les champs VARCHAR)
query TestGetFieldsBySqlType {
  getFields(sqlType: "VARCHAR") {
    value
    label
  }
}

# Test 19.5: Autocomplete sur le nom (sous-chaîne case-insensitive)
query TestGetFieldsByNamePattern {
  getFields(namePattern: "count") {
    value
    label
  }
}

# Test 19.6: Exclusion des clés primaires
query TestGetFieldsExcludePrimaryKeys {
  getFields(isPrimaryKey: false) {
    value
    label
  }
}

# Test 19.7: Filtres combinés (catégoriels + nom contenant "ind")
query TestGetFieldsCombined {
  getFields(isCategorical: true, namePattern: "ind") {
    value
    label
  }
}

# Test 19.8: Sur un catalogue spécifique
query TestGetFieldsOnDatabase {
  getFields(catalog: "macroeconomics", isCategorical: true) {
    value
    label
  }
}

# Test 19.9: Plusieurs sélections en parallèle (un menu par catégorie de type)
query TestGetFieldsMultiAlias {
  categoricalFields: getFields(isCategorical: true) {
    value
    label
  }
  numericFields: getFields(sqlType: "DOUBLE") {
    value
    label
  }
  textFields: getFields(sqlType: "VARCHAR") {
    value
    label
  }
}

# Test 19.10: Catalogue inconnu — doit lever une erreur
query TestGetFieldsInvalidDatabase {
  getFields(catalog: "nonexistent_xyz") {
    value
    label
  }
}

# ============================================
# 20. TESTS MULTI-SCHÉMA (argument schema)
# ============================================
#
# Un catalogue peut contenir plusieurs schémas. L'argument `schema` choisit le
# schéma au sein du catalogue choisi par `catalog`. Omis => schéma par défaut
# du catalogue (config SCHEMA, "main"). Les deux arguments sont disponibles sur
# getMetaData, getDimensionTable, getFactTable(WithMetadata), getAggregatedFacts(WithMetadata),
# getSelectOptions, getGroupedSelectOptions, getCatalogSchema et getFields.

# Test 20.1: Métadonnées d'un schéma nommé au sein d'un catalogue
query TestMetadataNamedSchema {
  getMetaData(name: "country", catalog: "default", schema: "main") {
    name
    label
    is_categorical
  }
}

# Test 20.2: Table des faits depuis un schéma précis
query TestFactTableNamedSchema {
  getFactTable(limit: 10, offset: 0, catalog: "default", schema: "main") {
    data {
      value
    }
    total
  }
}

# Test 20.3: Schéma (liste des champs) d'un schéma précis d'un catalogue
query TestGetCatalogSchemaNamedSchema {
  getCatalogSchema(catalog: "default", schema: "main") {
    name
    label
    is_categorical
  }
}

# Test 20.4: Comparaison de DEUX SCHÉMAS d'un MÊME catalogue (cross-schéma)
# Requiert ALLOW_CROSS_CATALOG_QUERIES=true. catalogA === catalogB, schémas différents.
# Les champs catégoriels sont résolus en labels via dim_* avant la jointure.
# /!\ Produit l'erreur suivante : "Cannot return null for non-nullable field Query.compareFacts."
query TestCompareFactsSameCatalogTwoSchemas {
  compareFacts(
    catalogA: "default"
    schemaA: "main"
    catalogB: "default"
    schemaB: "predictions"
    joinFields: ["country"]
    limit: 10
    offset: 0
  ) {
    data {
      key
      valueA
      valueB
      delta
      deltaPercent
    }
    total
  }
}

# Test 20.5: Agrégation cross-schéma même catalogue (jointure sur labels)
# /!\ Produit l'erreur suivante : "message": "Cannot return null for non-nullable field Query.compareAggregatedFacts."
query TestCompareAggregatedSameCatalogTwoSchemas {
  compareAggregatedFacts(
    catalogA: "default"
    schemaA: "main"
    catalogB: "default"
    schemaB: "predictions"
    groupBy: "country"
    aggregation: SUM
    limit: 10
    offset: 0
  ) {
    data {
      key
      valueA
      valueB
      delta
      deltaPercent
    }
    total
  }
}

# Test 20.6: Cross-catalogue avec schémas explicites par côté
# /!\ Ne retourne rien
query TestCompareFactsCrossCatalogExplicitSchemas {
  compareFacts(
    catalogA: "default"
    schemaA: "main"
    catalogB: "macroeconomics"
    schemaB: "main"
    joinFields: ["country", "indicator"]
