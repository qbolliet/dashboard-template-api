SECURITY:
  # Profondeur maximale des requêtes GraphQL
  MAX_QUERY_DEPTH: ${MAX_QUERY_DEPTH:-15}  
  # Configuration du rate limiting
  RATE_LIMIT:
    # Nombre maximum de requêtes par fenêtre
    MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
    # Durée de la fenêtre en millisecondes (15 minutes)
    WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
    # Nombre maximum de requêtes en rafale
    MAX_BURST_REQUESTS: ${RATE_LIMIT_BURST:-20}
    # Durée de la fenêtre de rafale (1 minute)
    BURST_WINDOW_MS: ${RATE_LIMIT_BURST_WINDOW:-60000}
    # Ignorer les requêtes échouées dans le comptage
    SKIP_FAILED_REQUESTS: false
    
  # Configuration de la complexité
  COMPLEXITY:
    # Complexité maximale autorisée
    MAX_ALLOWED: ${MAX_QUERY_COMPLEXITY:-100}
    # Coûts par type d'opération
    SCALAR_COST: 0
    OBJECT_COST: 1
    LIST_FACTOR: 10
    DEPTH_FACTOR: 1.5
    INTROSPECTION_COST: 1000
    # Scores personnalisés par opération
    CUSTOM_SCORES:
      getFactTable: 5
      getAggregatedFacts: 10
      getFactTableWithMetadata: 8
  
  # Configuration de la sanitization
  SANITIZATION:
    ENABLE_XSS: true
    ENABLE_SQL: true
    MAX_STRING_LENGTH: ${MAX_INPUT_LENGTH:-1000}
    # Tags HTML autorisés (vide = aucun)
    ALLOWED_TAGS: []
    # Sanitizers personnalisés par champ
    CUSTOM_SANITIZERS: {}
    
  # Configuration du monitoring
  MONITORING:
    # Seuil pour les requêtes lentes (ms)
    SLOW_QUERY_THRESHOLD: ${SLOW_QUERY_THRESHOLD:-1000}
    # Logger toutes les métriques (debug)
    LOG_ALL_METRICS: ${LOG_ALL_SECURITY_METRICS:-false}

# Configuration des timeouts basés sur la complexité
TIMEOUTS:
  # Timeout de base en millisecondes
  BASE_TIMEOUT: ${BASE_TIMEOUT:-5000}
  # Timeout additionnel par point de complexité
  TIMEOUT_PER_COMPLEXITY: ${TIMEOUT_PER_COMPLEXITY:-100}
  # Timeout maximum en millisecondes
  MAX_TIMEOUT: ${MAX_TIMEOUT:-30000}