SECURITY:
  # Profondeur maximale des requêtes GraphQL
  MAX_QUERY_DEPTH:
    development: 15
    production: 7
  # Configuration du rate limiting
  RATE_LIMIT:
    # Nombre maximum de requêtes par fenêtre
    MAX_REQUESTS: 100
    # Durée de la fenêtre en millisecondes (15 minutes)
    WINDOW_MS: 900000
    # Nombre maximum de requêtes en rafale
    MAX_BURST_REQUESTS: 20
    # Durée de la fenêtre de rafale (1 minute)
    BURST_WINDOW_MS: 60000
    # Ignorer les requêtes échouées dans le comptage
    SKIP_FAILED_REQUESTS: false
    # Activation de la limitation (false = passe-plat, réservé aux tests)
    ENABLED: ${RATE_LIMIT_ENABLED:-true}
    # Proxys de confiance (réglage Express « trust proxy ») : IPs, blocs CIDR ou plages
    # nommées (loopback, linklocal, uniquelocal). Liste YAML, chaîne JSON ('["10.0.0.0/8"]')
    # ou liste à virgules. Derrière l'ingress : le CIDR des pods de l'ingress controller.
    # ['*'] fait confiance à tous (déconseillé). Une entrée invalide empêche le démarrage.
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-[]}

  # Limitation stricte des routes d'administration (/api/cache/*, /api/catalog/*),
  # budget distinct de RATE_LIMIT ; toute requête compte, clé refusée comprise
  ADMIN_RATE_LIMIT:
    ENABLED: ${ADMIN_RATE_LIMIT_ENABLED:-true}
    # 10 requêtes par minute et par IP
    MAX_REQUESTS: 10
    WINDOW_MS: 60000
    MAX_BURST_REQUESTS: 10
    BURST_WINDOW_MS: 60000

  # Accès à /metrics : clé admin (en-tête x-admin-key) OU adresse de la liste. Aucune
  # liste par défaut : sans clé valide, 401. Liste YAML, chaîne JSON ('["10.0.0.0/8"]')
  # ou liste à virgules, d'IPs ou de blocs CIDR ; req.ip suit TRUSTED_PROXIES. Une entrée
  # invalide empêche le démarrage. Les IPs de la liste ne passent pas par le limiteur admin.
  METRICS:
    ALLOWED_IPS: ${METRICS_ALLOWED_IPS:-[]}

  # Configuration de la complexité — évaluée avant exécution (didResolveOperation).
  # Barème détaillé : docs-site/toolbox/docs/architecture/security.md
  COMPLEXITY:
    # Complexité maximale autorisée pour une opération
    # Calibré sur les requêtes réelles du dashboard : la page la plus lourde
    # (tableau + graphique getAggregates + menus + métadonnées) score ~69, soit une
    # marge de 2,9x.
    # Marge verrouillée par tests/integration/complexity-guard.test.ts.
    MAX_ALLOWED: 200
    # Nombre maximal de champs racine par opération, alias compris (__typename
    # exclu) : chaque champ racine est au moins une requête SQL ou un accès au cache
    MAX_ROOT_FIELDS: 20
    # Coûts par type de champ (les champs d'objet sont multipliés par
    # DEPTH_FACTOR^profondeur)
    SCALAR_COST: 0
    OBJECT_COST: 1
    DEPTH_FACTOR: 1.5
    # __schema et __type seulement (__typename est gratuit)
    INTROSPECTION_COST: 1000
    # Coût d'une ligne demandée par `limit`, borné à API.PAGINATION.MAX_LIMIT
    # (au-delà, le resolver répond BAD_USER_INPUT avant tout SQL) ; un `limit`
    # omis est facturé à la valeur par défaut déclarée dans le SDL
    ROW_COST: 0.1
    # Metadata.stats : une requête SQL par colonne (MIN, MAX, COUNT DISTINCT),
    # facturée pour chaque colonne de la liste englobante (nombre de colonnes du
    # schéma lu dans le cache catalogMetadata) — soit un getFieldStats par colonne
    STATS_COST_PER_COLUMN: 5
    # getAggregates, en plus de son score de base : chaque agrégat est une
    # expression du SELECT, MEDIAN et MODE (holistiques) trient ou comptent les
    # valeurs de chaque groupe, chaque colonne de groupe multiplie les groupes.
    # Longueur des listes lue dans les arguments (variables et défauts compris)
    AGGREGATE_COST: 2
    HOLISTIC_AGGREGATE_COST: 5
    GROUP_COLUMN_COST: 3
    # Score d'un champ racine absent de ROOT_FIELD_SCORES (jamais nul)
    DEFAULT_ROOT_FIELD_SCORE: 5
    # Score de base de CHAQUE champ racine du type Query (appliqué à la racine
    # seulement). Toute nouvelle query doit y figurer : un test le vérifie.
    ROOT_FIELD_SCORES:
      _empty: 1
      # Lecture de la configuration en mémoire
      getCatalogs: 1
      # Lecture des tables metadata / dataset_metadata (petites, en cache)
      getCatalogSchema: 2
      getDatasetInfo: 2
      getMetaData: 2
      getFields: 2
      getSharedFields: 3
      # DISTINCT sur une colonne, borné par `limit`
      getSelectOptions: 3
      getFactTable: 5
      # Une requête d'agrégats (MIN, MAX, COUNT DISTINCT) sur toute la table
      getFieldStats: 5
      # Scalaire JSON : un DISTINCT sur toute la chaîne de colonnes, borné par
      # API.SELECT_OPTIONS.TREE_MAX_NODES
      getSelectOptionsTree: 5
      getFactTableWithMetadata: 8
      # Plusieurs agrégats sur zéro, une ou plusieurs colonnes de groupe ; plus
      # AGGREGATE_COST, HOLISTIC_AGGREGATE_COST et GROUP_COLUMN_COST
      getAggregates: 10
      crossDatabaseSelectOptions: 10
      # Jointure de deux datasets
      compareFacts: 15
      compareAggregatedFacts: 15

  # Pas de section SANITIZATION : la sanitization XSS/SQL des valeurs n'a pas
  # d'objet sur ce chemin (SQL paramétré via treeToSQL, identifiants validés
  # contre la table metadata) et corromprait des libellés légitimes
  # (« Côte-d'Or »). Cf. src/security/manager.ts.

  # Bornes anti-abus de l'arbre de filtres (structuredFilters)
  FILTER_TREE:
    # Profondeur maximale d'imbrication des groupes (racine = 0)
    MAX_DEPTH: 5
    # Nombre maximal de critères (feuilles) dans l'arbre
    MAX_CRITERIA: 50
    # Nombre maximal de valeurs d'une liste IN / NOT_IN
    MAX_IN_VALUES: 1000
    # Longueur maximale d'un motif d'expression régulière (opération MATCHES)
    MAX_PATTERN_LENGTH: 200

  # Configuration du monitoring
  MONITORING:
    # Seuil pour les requêtes lentes (ms) — surchargeable via SLOW_QUERY_THRESHOLD pour debug
    SLOW_QUERY_THRESHOLD: ${SLOW_QUERY_THRESHOLD:-1000}
    # Logger toutes les métriques (debug) — surchargeable via LOG_ALL_SECURITY_METRICS
    LOG_ALL_METRICS: ${LOG_ALL_SECURITY_METRICS:-false}

# Configuration des timeouts basés sur la complexité
TIMEOUTS:
  # Timeout de base en millisecondes
  BASE_TIMEOUT: 5000
  # Timeout additionnel par point de complexité
  TIMEOUT_PER_COMPLEXITY: 100
  # Timeout maximum en millisecondes
  MAX_TIMEOUT: 30000

# Configuration des seuils de sécurité
SECURITY_LIMITS:
  # Seuil de profondeur par défaut pour les requêtes simples
  DEFAULT_DEPTH_LIMIT: 5
