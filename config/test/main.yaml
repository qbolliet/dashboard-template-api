# Test configuration - overrides production settings for testing

# Application settings
APP:
  NAME: "Dashboard API Tests"
  VERSION: "1.0.0-test"
  ENVIRONMENT: "test"

# Override all configuration for test environment
test_overrides:
  # Database configuration for tests
  DATABASE_ROUTING:
    DEFAULT_DATABASE: "main"
    ALLOWED_DATABASES: ["main", "test", "analytics"]
    ALLOW_CROSS_DATABASE_QUERIES: true

  DATABASES:
    main:
      PATH: "test-data/main.db"
      POOL:
        MAX_CONNECTIONS: 3
        ACQUIRE_TIMEOUT: 5000
        CONNECTION_RETRY_DELAY: 500
        CONNECTION_RETRY_MAX: 2
    test:
      PATH: "test-data/test.db"
      POOL:
        MAX_CONNECTIONS: 2
        ACQUIRE_TIMEOUT: 3000
        CONNECTION_RETRY_DELAY: 300
        CONNECTION_RETRY_MAX: 1
    analytics:
      PATH: "test-data/analytics.db"
      POOL:
        MAX_CONNECTIONS: 2
        ACQUIRE_TIMEOUT: 3000
        CONNECTION_RETRY_DELAY: 300
        CONNECTION_RETRY_MAX: 1

  # API configuration for tests
  API:
    PORT: 0 # Use random port for tests
    CORS:
      ENABLED: true
      ORIGINS: ["http://localhost:3000", "http://127.0.0.1:3000"]
    LOADERS:
      DEFAULT_CACHE_TIMEOUT: 1000 # Short cache timeout for tests
      BATCH_SIZE: 5

  # Security configuration for tests
  SECURITY:
    RATE_LIMIT:
      ENABLED: false # Disable rate limiting for tests
      MAX_REQUESTS: 10000
      TIME_WINDOW: 60000
      BURST_LIMIT: 1000
    COMPLEXITY:
      MAX_COMPLEXITY: 10000 # Higher limits for tests
      MAX_DEPTH: 50
      INTROSPECTION_COST: 1
    SANITIZATION:
      ENABLED: true
      XSS_PROTECTION: true
      SQL_INJECTION_PROTECTION: true

  # Cache configuration for tests
  CACHE:
    REDIS:
      HOST: "${REDIS_HOST:-localhost}"
      PORT: ${REDIS_PORT:-6379}
      PASSWORD: null
      KEY_PREFIX: "${REDIS_KEY_PREFIX:-test:api:}"
      OPTIONS:
        RETRY_STRATEGY:
          BASE_DELAY: 50
          MAX_DELAY: 1000
        MAX_RETRIES_PER_REQUEST: 2
        CONNECT_TIMEOUT: 5000
        ENABLE_READY_CHECK: false
      CLUSTER:
        ENABLED: false
        NODES: []

  # Logging configuration for tests
  LOGGING:
    LEVEL: "${LOG_LEVEL:-error}"
    FORMAT: "simple"
    ENABLE_FILE_LOGGING: false
    ENABLE_CONSOLE_LOGGING: true
    SAMPLING:
      ENABLED: false