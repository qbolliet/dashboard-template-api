# Test database configuration

CATALOG_ROUTING:
  DEFAULT_CATALOG: 'main'
  ALLOWED_CATALOGS: ['main', 'test', 'analytics']
  ALLOW_CROSS_CATALOG_QUERIES: true

CATALOGS:
  main:
    PATH: 'data/test-main.ducklake'
    DATA_PATH: 'data/test-main_data/'
    READ_ONLY: false
    SCHEMAS: ['main']
  test:
    PATH: 'data/test-test.ducklake'
    DATA_PATH: 'data/test-test_data/'
    READ_ONLY: false
    SCHEMAS: ['main']
  analytics:
    PATH: 'data/test-analytics.ducklake'
    DATA_PATH: 'data/test-analytics_data/'
    READ_ONLY: false
    SCHEMAS: ['main']

DATABASE:
  POOL:
    MAX_CONNECTIONS: 3
    ACQUIRE_TIMEOUT: 5000
    POOL_RETRY_DELAY: 100
