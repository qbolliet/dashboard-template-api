# Test security configuration - more permissive for testing

SECURITY:
  RATE_LIMIT:
    # Limitation désactivée pour les tests (clés alignées sur RateLimiter)
    ENABLED: false
    MAX_REQUESTS: 10000
    WINDOW_MS: 60000
    MAX_BURST_REQUESTS: 1000
    BURST_WINDOW_MS: 60000
    SKIP_FAILED_REQUESTS: false
    TRUSTED_PROXIES: []

  COMPLEXITY:
    # Plafond très haut : les tests de complexité instancient leur propre analyseur
    MAX_ALLOWED: 10000
    INTROSPECTION_COST: 1
    DEPTH_FACTOR: 1
