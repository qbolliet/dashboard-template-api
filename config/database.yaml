DATABASES:
  default:
    PATH: ${DB_PATH:-../dashboard-template-database/outputs/database.db}
    POOL:
      MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
      ACQUIRE_TIMEOUT: ${DB_ACQUIRE_TIMEOUT:-60000}
      CONNECTION_RETRY_DELAY: ${DB_CONNECTION_RETRY_DELAY:-1000}
      CONNECTION_RETRY_MAX: ${DB_CONNECTION_RETRY_MAX:-3}
      POOL_RETRY_DELAY: ${DB_POOL_RETRY_DELAY:-500}
  macroeconomics:
    PATH: ${MACROECONOMICS_DB_PATH:-../dashboard-template-database/outputs/macroeconomics.db}
    POOL:
      MAX_CONNECTIONS: ${MACROECONOMICS_DB_MAX_CONNECTIONS:-3}
      ACQUIRE_TIMEOUT: ${MACROECONOMICS_DB_ACQUIRE_TIMEOUT:-60000}
      CONNECTION_RETRY_DELAY: ${MACROECONOMICS_DB_CONNECTION_RETRY_DELAY:-1000}
      CONNECTION_RETRY_MAX: ${MACROECONOMICS_DB_CONNECTION_RETRY_MAX:-3}
      POOL_RETRY_DELAY: ${MACROECONOMICS_DB_POOL_RETRY_DELAY:-500}
  public_finance:
    PATH: ${PUBLIC_FINANCE_DB_PATH:-../dashboard-template-database/outputs/public_finance.db}
    POOL:
      MAX_CONNECTIONS: ${PUBLIC_FINANCE_DB_MAX_CONNECTIONS:-3}
      ACQUIRE_TIMEOUT: ${PUBLIC_FINANCE_DB_ACQUIRE_TIMEOUT:-60000}
      CONNECTION_RETRY_DELAY: ${PUBLIC_FINANCE_DB_CONNECTION_RETRY_DELAY:-1000}
      CONNECTION_RETRY_MAX: ${PUBLIC_FINANCE_DB_CONNECTION_RETRY_MAX:-3}
      POOL_RETRY_DELAY: ${PUBLIC_FINANCE_DB_POOL_RETRY_DELAY:-500}

DATABASE_ROUTING:
  DEFAULT_DATABASE: ${DEFAULT_DATABASE:-default}
  ALLOWED_DATABASES: ${ALLOWED_DATABASES:-["default", "macroeconomics", "public_finance"]}
  ALLOW_CROSS_DATABASE_QUERIES: ${ALLOW_CROSS_DATABASE_QUERIES:-false}