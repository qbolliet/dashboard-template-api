# Chaque catalogue peut être adossé soit à un fichier `.ducklake` (TYPE: file,
# cas statique), soit à une base Postgres (TYPE: postgres, catalogue mis à jour à
# chaud par un writer externe). Pour un catalogue Postgres, renseigner le bloc
# POSTGRES (les identifiants transitent par un secret DuckDB, pas par les logs)
# et faire pointer DATA_PATH vers le stockage des Parquet (souvent s3://...).
CATALOGS:
  default:
    TYPE: ${DEFAULT_CATALOG_TYPE:-file}
    PATH: ${DEFAULT_CATALOG_PATH:-../dashboard-template-database/outputs/default.ducklake}
    DATA_PATH: ${DEFAULT_DATA_PATH:-../dashboard-template-database/outputs/default_data/}
    READ_ONLY: ${DEFAULT_READ_ONLY:-true}
    # Liste blanche des schémas servis (JSON dans une variable d'env). Vide ou absente :
    # tous les schémas du catalogue sont servis, découverts à l'attach et à chaque
    # rechargement (« main » d'abord, puis l'ordre alphabétique). Fournie : seuls ces
    # schémas sont servis, le premier étant le défaut quand la requête n'en précise aucun.
    SCHEMAS: ${DEFAULT_SCHEMAS:-}
    # Utilisé uniquement quand TYPE=postgres
    POSTGRES:
      HOST: ${DEFAULT_PG_HOST:-}
      PORT: ${DEFAULT_PG_PORT:-5432}
      DATABASE: ${DEFAULT_PG_DATABASE:-}
      USER: ${DEFAULT_PG_USER:-}
      PASSWORD: ${DEFAULT_PG_PASSWORD:-}
  macroeconomics:
    # Convention pour activer Postgres : MACROECONOMICS_CATALOG_TYPE=postgres
    # + bloc POSTGRES (cf. clés MACROECONOMICS_PG_HOST / _PORT / _DATABASE / _USER / _PASSWORD)
    TYPE: ${MACROECONOMICS_CATALOG_TYPE:-file}
    PATH: ${MACROECONOMICS_CATALOG_PATH:-../dashboard-template-database/outputs/macroeconomics.ducklake}
    DATA_PATH: ${MACROECONOMICS_DATA_PATH:-../dashboard-template-database/outputs/macroeconomics_data/}
    READ_ONLY: ${MACROECONOMICS_READ_ONLY:-true}
    SCHEMAS: ${MACROECONOMICS_SCHEMAS:-}
  public_finance:
    TYPE: ${PUBLIC_FINANCE_CATALOG_TYPE:-file}
    PATH: ${PUBLIC_FINANCE_CATALOG_PATH:-../dashboard-template-database/outputs/public_finance.ducklake}
    DATA_PATH: ${PUBLIC_FINANCE_DATA_PATH:-../dashboard-template-database/outputs/public_finance_data/}
    READ_ONLY: ${PUBLIC_FINANCE_READ_ONLY:-true}
    SCHEMAS: ${PUBLIC_FINANCE_SCHEMAS:-}

DATABASE:
  POOL:
    MAX_CONNECTIONS: 5
    ACQUIRE_TIMEOUT: 60000
    POOL_RETRY_DELAY: 500

# Versions du schéma de base (dataset_metadata.schema_version) lisibles par cette
# API. Un schéma dont la version n'y figure pas, ou dépourvu de table
# dataset_metadata, est signalé à l'attach et refusé à la requête
# (SCHEMA_VERSION_UNSUPPORTED). Aucun chemin de compatibilité.
SUPPORTED_SCHEMA_VERSIONS: ${SUPPORTED_SCHEMA_VERSIONS:-[1]}

# Détection des mises à jour de données sur chaque réplica. Toutes les
# INTERVAL_MS, le pod relit dataset_metadata.updated_at de chaque schéma sur un
# ATTACH neuf ; si un marqueur a changé, il recharge ses catalogues et bascule
# ses clés de cache Redis sur la nouvelle version. L'updater n'a plus rien à
# appeler : la fraîcheur est garantie en un intervalle (plus la durée du reload).
CATALOG_FRESHNESS:
  ENABLED: ${CATALOG_FRESHNESS_ENABLED:-true}
  INTERVAL_MS: ${CATALOG_FRESHNESS_INTERVAL_MS:-60000}

CATALOG_ROUTING:
  DEFAULT_CATALOG: ${DEFAULT_CATALOG:-default}
  # Vide : tous les catalogues de CATALOGS sont autorisés. Fournie (JSON) : seuls ceux-là.
  ALLOWED_CATALOGS: ${ALLOWED_CATALOGS:-}
  ALLOW_CROSS_CATALOG_QUERIES: ${ALLOW_CROSS_CATALOG_QUERIES:-false}

S3:
  ENABLED: ${S3_ENABLED:-false}
  ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-}
  SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  REGION: ${AWS_REGION:-eu-west-1}
  ENDPOINT: ${S3_ENDPOINT:-}
