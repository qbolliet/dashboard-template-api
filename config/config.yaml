PATH : "./../../dashboard-template-database/outputs/database.db"
DOMAIN : 'https://your-production-domain.com'
ALLOWED_OPERATIONS : ['getMetaData', 'getDimensionTable', 'getFactTable', 'getAggregatedFacts', 'getSelectOptions', 'getGroupedSelectOptions']
REQUEST_LIMITS :
  MAX_REQUEST_SIZE: '100kb'
  MAX_FIELD_SIZE: 1000
  MAX_FIELDS: 50
CACHE :
  DEFAULT_MAX_AGE: 300 # 5 minutes
  PUBLIC_PATHS: ['/graphql']
  VARY_BY_HEADERS: ['accept-encoding', 'accept']
DB_MAX_CONNECTIONS: 5
DB_ACQUIRE_TIMEOUT: 60000
PORT: 4000