CACHE:
  REDIS:
    HOST: ${REDIS_HOST:-localhost}
    PORT: ${REDIS_PORT:-6379}
    PASSWORD: ${REDIS_PASSWORD}
    OPTIONS:
      RETRY_STRATEGY:
        MAX_DELAY: 2000
        BASE_DELAY: 50
      MAX_RETRIES_PER_REQUEST: 3
      ENABLE_READY_CHECK: true
      CONNECT_TIMEOUT: 10000
      # Configuration cluster optionnelle
      CLUSTER:
        ENABLED: ${REDIS_CLUSTER:-false}
        NODES:
          - host: ${REDIS_NODE1_HOST:-localhost}
            port: ${REDIS_NODE1_PORT:-6379}
          - host: ${REDIS_NODE2_HOST:-localhost}
            port: ${REDIS_NODE2_PORT:-6380}
    DB: ${REDIS_DB:-0} # Utile
    KEY_PREFIX: ${REDIS_KEY_PREFIX:-'graphql-api:'}
  
  TTL:  # En secondes
    DEFAULT: 300
    METADATA: 600      
    DIMENSIONS: 600    
    FACTS: 300        
    AGGREGATED_FACTS: 300   
    SELECT_OPTIONS: 600
    COUNT_QUERIES: 300

  # Cache invalidation settings for database updates
  INVALIDATION:
    # Time in seconds to wait after database update before invalidating cache
    GRACE_PERIOD: ${CACHE_INVALIDATION_GRACE_PERIOD:-60}
    # Enable automatic cache invalidation on database version changes
    AUTO_INVALIDATE: ${CACHE_AUTO_INVALIDATE:-true}
    # Batch size for key deletion during invalidation
    BATCH_SIZE: ${CACHE_INVALIDATION_BATCH_SIZE:-1000}
    # Maximum time to wait for cache invalidation to complete
    TIMEOUT: ${CACHE_INVALIDATION_TIMEOUT:-30000}
  
  HTTP_CACHE:
    PUBLIC_PATHS: ['/graphql']
    VARY_BY_HEADERS: ['accept-encoding', 'accept']