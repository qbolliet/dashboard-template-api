API:
  PORT: ${PORT:-4000}
  DOMAIN: ${API_DOMAIN:-'https://your-production-domain.com'}
  
  CORS:
    CREDENTIALS: true
    METHODS: ['GET', 'POST', 'OPTIONS']
    HEADERS: ['Content-Type', 'Authorization']
    ORIGINS:
      development: 
        - 'https://studio.apollographql.com'
        - 'http://localhost:3000'
        - 'http://localhost:5173'
      production: 
        - ${API_DOMAIN:-'https://your-production-domain.com'}
  
  REQUEST_LIMITS:
    MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-'100kb'}
    MAX_FIELD_SIZE: ${MAX_FIELD_SIZE:-1000}
    MAX_FIELDS: ${MAX_FIELDS:-50}
  
  GRAPHQL:
    INTROSPECTION:
      development: true
      production: false
    PLAYGROUND:
      development: true
      production: false
  
  COMPRESSION:
    ENABLED: true
    THRESHOLD: 1024  # 1KB
    LEVEL: 6
  
  # Pagination limits
  PAGINATION:
    DEFAULT_LIMIT: ${DEFAULT_PAGINATION_LIMIT:-100}
    MAX_LIMIT: ${MAX_PAGINATION_LIMIT:-1000}
    MAX_OFFSET: ${MAX_PAGINATION_OFFSET:-10000}
    SELECT_OPTIONS_LIMIT: ${SELECT_OPTIONS_LIMIT:-50}
  
  # Query timeouts by operation type (ms)
  TIMEOUTS:
    FACT_SIMPLE: ${FACT_SIMPLE_TIMEOUT:-10000}
    FACT_COMPLEX: ${FACT_COMPLEX_TIMEOUT:-15000}
    AGGREGATED_SIMPLE: ${AGGREGATED_SIMPLE_TIMEOUT:-10000}
    AGGREGATED_COMPLEX: ${AGGREGATED_COMPLEX_TIMEOUT:-15000}
    DIMENSION: ${DIMENSION_TIMEOUT:-5000}
    METADATA: ${METADATA_TIMEOUT:-5000}
    SELECT_OPTIONS: ${SELECT_OPTIONS_TIMEOUT:-5000}
    CACHE_DEFAULT: ${CACHE_DEFAULT_TIMEOUT:-300}
  
  # Security thresholds
  SECURITY_THRESHOLDS:
    HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    VALIDATION_MAX_LENGTH: ${VALIDATION_MAX_LENGTH:-500}
    ERROR_TRUNCATION_LENGTH: ${ERROR_TRUNCATION_LENGTH:-50}
    QUERY_SNIPPET_LENGTH: ${QUERY_SNIPPET_LENGTH:-100}
  
  # Data loader configuration
  LOADERS:
    BATCH_SIZE: ${LOADER_BATCH_SIZE:-10}
    MAX_BATCH_SIZE: ${MAX_LOADER_BATCH_SIZE:-50}
    DEFAULT_CACHE_TIMEOUT: ${LOADER_CACHE_TIMEOUT:-300}
    FACT_CACHE_TIMEOUT: ${FACT_LOADER_CACHE_TIMEOUT:-300}
    DIMENSION_CACHE_TIMEOUT: ${DIMENSION_LOADER_CACHE_TIMEOUT:-600}
    METADATA_CACHE_TIMEOUT: ${METADATA_LOADER_CACHE_TIMEOUT:-600}
    SELECT_OPTIONS_CACHE_TIMEOUT: ${SELECT_OPTIONS_LOADER_CACHE_TIMEOUT:-600}