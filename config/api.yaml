API:
  PORT: ${PORT:-4000}
  DOMAIN: ${API_DOMAIN:-'https://your-production-domain.com'}

  CORS:
    CREDENTIALS: true
    METHODS: ['GET', 'POST', 'OPTIONS']
    HEADERS: ['Content-Type', 'Authorization']
    ORIGINS:
      development:
        - 'https://studio.apollographql.com'
        - 'http://localhost:3000'
        - 'http://localhost:5173'
      production:
        - ${API_DOMAIN:-'https://your-production-domain.com'}

  REQUEST_LIMITS:
    MAX_REQUEST_SIZE: '100kb'
    MAX_FIELD_SIZE: 1000
    MAX_FIELDS: 50

  GRAPHQL:
    INTROSPECTION:
      development: true
      production: false
    PLAYGROUND:
      development: true
      production: false

  COMPRESSION:
    ENABLED: true
    THRESHOLD: 1024  # 1KB
    LEVEL: 6

  # Pagination limits
  PAGINATION:
    DEFAULT_LIMIT: 100
    MAX_LIMIT: 1000
    MAX_OFFSET: 10000
    SELECT_OPTIONS_LIMIT: 50

  # Query timeouts by operation type (ms)
  TIMEOUTS:
    FACT_SIMPLE: 10000
    FACT_COMPLEX: 15000
    AGGREGATED_SIMPLE: 10000
    AGGREGATED_COMPLEX: 15000
    DIMENSION: 5000
    METADATA: 5000
    SELECT_OPTIONS: 5000
    CACHE_DEFAULT: 300

  # Security thresholds
  SECURITY_THRESHOLDS:
    HSTS_MAX_AGE: 31536000
    VALIDATION_MAX_LENGTH: 500
    ERROR_TRUNCATION_LENGTH: 50
    QUERY_SNIPPET_LENGTH: 100

  # Data loader configuration
  LOADERS:
    BATCH_SIZE: 10
    MAX_BATCH_SIZE: 50
    DEFAULT_CACHE_TIMEOUT: 300
    FACT_CACHE_TIMEOUT: 300
    DIMENSION_CACHE_TIMEOUT: 600
    METADATA_CACHE_TIMEOUT: 600
    SELECT_OPTIONS_CACHE_TIMEOUT: 600
