API:
  PORT: ${PORT:-4000}
  DOMAIN: ${API_DOMAIN:-'https://your-production-domain.com'}

  CORS:
    CREDENTIALS: true
    METHODS: ['GET', 'POST', 'OPTIONS']
    HEADERS: ['Content-Type', 'Authorization']
    ORIGINS:
      development:
        - 'https://studio.apollographql.com'
        - 'http://localhost:3000'
        - 'http://localhost:5173'
      production:
        - ${API_DOMAIN:-'https://your-production-domain.com'}

  REQUEST_LIMITS:
    MAX_REQUEST_SIZE: '100kb'
    MAX_FIELD_SIZE: 1000
    MAX_FIELDS: 50

  GRAPHQL:
    INTROSPECTION:
      development: true
      production: false
    PLAYGROUND:
      development: true
      production: false

  COMPRESSION:
    ENABLED: true
    THRESHOLD: 1024 # 1KB
    LEVEL: 6

  # Pagination limits
  PAGINATION:
    DEFAULT_LIMIT: 100
    MAX_LIMIT: 1000
    MAX_OFFSET: 10000
    SELECT_OPTIONS_LIMIT: 50

  # Arbres d'options (getSelectOptionsTree)
  SELECT_OPTIONS:
    # Nombre maximal de nœuds d'un arbre ; au-delà, erreur explicite invitant
    # à utiliser searchTerm ou maxDepth (aucune troncature silencieuse)
    TREE_MAX_NODES: 5000

  # Export REST volumineux (GET /api/export) — garde-fous propres, hors GraphQL
  EXPORT:
    # Plafond de lignes, appliqué par LIMIT dans la requête
    MAX_ROWS: ${EXPORT_MAX_ROWS:-5000000}
    # Exports simultanés par IP (429 au-delà)
    MAX_CONCURRENT_PER_IP: ${EXPORT_MAX_CONCURRENT_PER_IP:-2}
    # Exports simultanés tous clients confondus : chaque export occupe une
    # connexion du pool pendant toute sa durée, GraphQL doit garder les autres
    MAX_CONCURRENT_TOTAL: ${EXPORT_MAX_CONCURRENT_TOTAL:-2}
    # Durée maximale d'un export (ms) : interruption de la requête puis fin du flux
    TIMEOUT_MS: ${EXPORT_TIMEOUT_MS:-120000}
    # Répertoire des fichiers temporaires csv/parquet (vide = <tmp système>/dashboard-api-export)
    TMP_DIR: ${EXPORT_TMP_DIR:-}

  # Query timeouts by operation type (ms)
  TIMEOUTS:
    FACT_SIMPLE: 10000
    FACT_COMPLEX: 15000
    AGGREGATED_SIMPLE: 10000
    AGGREGATED_COMPLEX: 15000
    METADATA: 5000
    SELECT_OPTIONS: 5000
    CACHE_DEFAULT: 300

  # Security thresholds
  SECURITY_THRESHOLDS:
    HSTS_MAX_AGE: 31536000
    VALIDATION_MAX_LENGTH: 500
    ERROR_TRUNCATION_LENGTH: 50
    QUERY_SNIPPET_LENGTH: 100

  # Data loader configuration
  LOADERS:
    BATCH_SIZE: 10
    MAX_BATCH_SIZE: 50
    DEFAULT_CACHE_TIMEOUT: 300
    FACT_CACHE_TIMEOUT: 300
    METADATA_CACHE_TIMEOUT: 600
    SELECT_OPTIONS_CACHE_TIMEOUT: 600
