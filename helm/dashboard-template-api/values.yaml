# Default values for dashboard-template-api.
# Override what you need with `-f my-values.yaml` or `--set`.

# -- Container image
image:
  repository: ghcr.io/qbolliet/dashboard-template-api
  # If empty, falls back to .Chart.AppVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Number of replicas (ignored when autoscaling.enabled)
replicaCount: 2

# -- Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- Service exposed inside the cluster
service:
  type: ClusterIP
  port: 80
  targetPort: 4000

# -- Ingress (TLS via cert-manager recommended)
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-tls
      hosts:
        - api.example.com

# -- Resource requests/limits per pod
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# -- Horizontal pod autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

# -- PodDisruptionBudget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# -- Probes (paths match endpoints exposed by src/server.ts)
probes:
  liveness:
    httpGet:
      path: /health
      port: 4000
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    httpGet:
      path: /ready
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

# -- Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Non-secret env vars rendered as ConfigMap
# Anything you put here ends up as `envFrom: configMapRef`
config:
  NODE_ENV: production
  ENVIRONMENT: production

  # DuckLake catalog routing
  DEFAULT_DATABASE: default
  ALLOWED_DATABASES: '["default"]'
  ALLOW_CROSS_DATABASE_QUERIES: "false"

  # Catalog locations (S3 URIs in production)
  DEFAULT_CATALOG_PATH: s3://my-bucket/default.ducklake
  DEFAULT_DATA_PATH: s3://my-bucket/default_data/
  DEFAULT_READ_ONLY: "true"
  DEFAULT_SCHEMA: main

  # S3 backend
  S3_ENABLED: "true"
  AWS_REGION: eu-west-1

  # Redis connection (host points at the in-chart sub-chart by default)
  # Override REDIS_HOST when redis.enabled=false
  REDIS_PORT: "6379"

  # Reverse-proxy / rate limiting
  TRUSTED_PROXIES: '["10.0.0.0/8"]'

  # Logging — stdout only (compatible with readOnlyRootFilesystem)
  LOG_TO_FILE: "false"

# -- Application secrets
# Either inline `data` (for dev/test) or point at an existing Secret managed
# externally (ExternalSecrets / SealedSecrets / sops). Production should
# always set `existingSecret` and leave `data` empty.
secrets:
  existingSecret: ""
  data:
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    S3_ENDPOINT: ""
    ADMIN_API_KEY: ""

# -- Redis sub-chart (Bitnami)
# When enabled, an in-cluster Redis is provisioned. The Bitnami chart auto-
# generates and manages the password under Secret "<release>-redis" (key
# "redis-password"); the API reads it via valueFrom in deployment.yaml.
# Set redis.enabled=false to bring your own Redis (then provide REDIS_HOST in
# values.config and REDIS_PASSWORD in secrets.data).
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
  master:
    persistence:
      enabled: true
      size: 8Gi
  replica:
    replicaCount: 0

# -- Scheduling
nodeSelector: {}
tolerations: []
affinity: {}

# -- Extra pod annotations / labels
podAnnotations: {}
podLabels: {}
