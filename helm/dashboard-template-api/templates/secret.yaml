{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dta.appSecretName" . }}
  labels:
    {{- include "dta.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- /*
  Per-catalog Postgres credentials: each entry under .Values.secrets.postgresCatalogs
  produces <NAME_UPPER>_PG_USER and <NAME_UPPER>_PG_PASSWORD env vars.
  */}}
  {{- range $name, $creds := .Values.secrets.postgresCatalogs }}
  {{- $upper := upper $name }}
  {{ $upper }}_PG_USER: {{ default "" $creds.user | b64enc | quote }}
  {{ $upper }}_PG_PASSWORD: {{ default "" $creds.password | b64enc | quote }}
  {{- end }}
{{- end }}
